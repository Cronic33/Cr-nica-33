<!DOCTYPE html>
<html lang="{{IDIOMA}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITOL}}</title>
  {{META}}
  <meta name="theme-color" content="#0b0b0d">
  <link rel="icon" href="{{FAVICON}}">
  <link rel="alternate" type="application/rss+xml" title="{{NOM}}" href="/rss.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,700;1,900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,700;1,900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"></noscript>
  <link rel="stylesheet" href="/estil.css">
  <style>:root { --marca: {{COLOR}}; }</style>
</head>
<body class="{{CLASSE}}">
  <a class="salta" href="#principal">Saltar al contenido</a>

  <header class="capcalera">
    <div class="barra-superior">
      <div class="contenidor barra-superior-cos">
        <span class="data-avui" id="data-avui"></span>
        <div class="barra-accions">
          <a class="enllac-cerca" href="/buscar/">Buscar</a>
          <button type="button" id="canvia-tema" class="boto-tema" aria-label="Cambiar entre tema claro y oscuro">◐</button>
        </div>
      </div>
    </div>

    <div class="contenidor capcalera-cos">
      <button type="button" id="obre-menu" class="boto-menu" aria-label="Abrir el menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <a class="marca" href="/">{{MARCA}}</a>
      <a class="boto boto-petit boto-rss" href="/rss.xml">RSS</a>
    </div>

    <nav class="navegacio" id="navegacio" aria-label="Secciones">
      <div class="contenidor navegacio-cos">{{NAV}}</div>
    </nav>
  </header>

  {{ULTIMA_HORA}}

  <main id="principal" class="contenidor">
    {{CONTINGUT}}
  </main>

  <footer class="peu">
    <div class="contenidor">
      {{PEU}}
      <p class="peu-legal">&copy; {{ANY}} {{NOM}}. {{LEGAL}}</p>
    </div>
  </footer>

  <div class="galetes" id="galetes" hidden>
    <p>Usamos cookies propias y de terceros para medir la audiencia y mostrar publicidad.
      Puedes aceptarlas o seguir solo con las necesarias.
      <a href="/cookies/">Más información</a>.</p>
    <div class="galetes-botons">
      <button type="button" class="boto boto-fantasma" id="rebutja-galetes">Solo necesarias</button>
      <button type="button" class="boto" id="accepta-galetes">Aceptar todo</button>
    </div>
  </div>

  <script src="/app.js" defer></script>
  {{SCRIPTS}}
</body>
</html>
